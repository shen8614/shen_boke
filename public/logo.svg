<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- 装饰线条 -->
  <path d="M20 85 L40 35 L60 70 L80 25 L100 60" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.4"/>
  <!-- 字母 S -->
  <text x="60" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="60" font-weight="800" fill="white" letter-spacing="-2">S</text>
  <!-- 装饰点 -->
  <circle cx="20" cy="30" r="3" fill="white" opacity="0.5"/>
  <circle cx="100" cy="90" r="2.5" fill="white" opacity="0.4"/>
  <circle cx="95" cy="25" r="2" fill="white" opacity="0.3"/>
</svg>
