<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="circuit" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- 节点 -->
      <circle cx="20" cy="20" r="2" fill="#6366f1" opacity="0.15"/>
      <circle cx="100" cy="20" r="2" fill="#6366f1" opacity="0.12"/>
      <circle cx="180" cy="20" r="2" fill="#6366f1" opacity="0.15"/>
      <circle cx="60" cy="60" r="2.5" fill="#6366f1" opacity="0.18"/>
      <circle cx="140" cy="60" r="2" fill="#6366f1" opacity="0.12"/>
      <circle cx="20" cy="100" r="2" fill="#6366f1" opacity="0.12"/>
      <circle cx="100" cy="100" r="3" fill="#6366f1" opacity="0.2"/>
      <circle cx="180" cy="100" r="2" fill="#6366f1" opacity="0.12"/>
      <circle cx="60" cy="140" r="2" fill="#6366f1" opacity="0.12"/>
      <circle cx="140" cy="140" r="2.5" fill="#6366f1" opacity="0.18"/>
      <circle cx="20" cy="180" r="2" fill="#6366f1" opacity="0.15"/>
      <circle cx="100" cy="180" r="2" fill="#6366f1" opacity="0.12"/>
      <circle cx="180" cy="180" r="2" fill="#6366f1" opacity="0.15"/>
      <!-- 连线：水平 -->
      <line x1="22" y1="20" x2="98" y2="20" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <line x1="102" y1="20" x2="178" y2="20" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <line x1="62" y1="60" x2="138" y2="60" stroke="#6366f1" stroke-width="0.5" opacity="0.1"/>
      <line x1="22" y1="100" x2="98" y2="100" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <line x1="102" y1="100" x2="178" y2="100" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <line x1="62" y1="140" x2="138" y2="140" stroke="#6366f1" stroke-width="0.5" opacity="0.1"/>
      <line x1="22" y1="180" x2="98" y2="180" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <line x1="102" y1="180" x2="178" y2="180" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <!-- 连线：垂直 -->
      <line x1="20" y1="22" x2="20" y2="98" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <line x1="20" y1="102" x2="20" y2="178" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <line x1="100" y1="22" x2="100" y2="98" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <line x1="100" y1="102" x2="100" y2="178" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <line x1="180" y1="22" x2="180" y2="98" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <line x1="180" y1="102" x2="180" y2="178" stroke="#6366f1" stroke-width="0.5" opacity="0.08"/>
      <!-- 连线：对角 -->
      <line x1="22" y1="22" x2="58" y2="58" stroke="#22d3ee" stroke-width="0.4" opacity="0.06"/>
      <line x1="142" y1="62" x2="178" y2="98" stroke="#22d3ee" stroke-width="0.4" opacity="0.06"/>
      <line x1="62" y1="142" x2="98" y2="178" stroke="#22d3ee" stroke-width="0.4" opacity="0.06"/>
      <!-- 小方块（芯片） -->
      <rect x="92" y="92" width="16" height="16" rx="2" fill="none" stroke="#6366f1" stroke-width="0.6" opacity="0.12"/>
      <rect x="52" y="52" width="16" height="16" rx="2" fill="none" stroke="#6366f1" stroke-width="0.6" opacity="0.1"/>
      <rect x="132" y="132" width="16" height="16" rx="2" fill="none" stroke="#6366f1" stroke-width="0.6" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#circuit)"/>
</svg>
