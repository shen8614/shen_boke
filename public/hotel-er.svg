<text x="500" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2937">酒店客房管理系统 ER 图（Chen 记法）</text>

<!-- Legend -->
<g font-size="10" transform="translate(30,590)">
<rect width="56" height="24" rx="5" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="28" y="16" text-anchor="middle" fill="#1e40af" font-weight="600">实体</text>
